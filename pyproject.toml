[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymfr"
version = "3.0.0"
description = "Open-source tools for analyzing time-series data of magnetic flux ropes (MFRs)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hameedullah A. Farooki", email = "hafarooki@princeton.edu" }]
keywords = ["pymfr", "fluxrope", "mfr", "smfr", "grad-shafranov", "gs"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "tqdm",
    "xarray",
]

[tool.hatch.build.targets.wheel]
packages = ["pymfr"]

[dependency-groups]
dev = [
    "cdasws>=1.8.18",
    "cdflib>=1.3.14",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
]
